# Ground vehicle: instance-seg + tracker. Aux maps stay off until probe VRAM is known.
weights: yolo26n-seg.pt
source: 0
imgsz: 640
conf: 0.25
iou: 0.7
device: 0
tracker: bytetrack.yaml
task: segment
persist: true
show: false
verbose: false
max_lost: 30
events_dir: outputs/events
log_every: 30
aux: []
